name: ci
on:
  pull_request: {}
  push:
    branches: [main]
permissions:
  contents: read
# The job ids `check` and `migrations` are the required checks in .github/rulesets/protect-main.json.
# Don't rename them, give them a `name:`, add a matrix, or move them to another workflow: a PR then
# waits forever for a check that never reports. Add new work as steps in these jobs where you can.
# A new job that must gate merging is either added to protect-main.json's required checks (and
# the ruleset re-applied) or listed in a required job's `needs:`. Then that required job needs
# `if: always()` and a first step
#   - if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
#     run: exit 1
# because a failing dependency skips it, and GitHub counts a skipped required check as passed.
jobs:
  # Secret scan (gitleaks), defined in secrets.yml, which also runs on every push to another branch.
  secrets:
    uses: ./.github/workflows/secrets.yml
  # Known vulnerabilities in any installed package, high or critical (npm audit), and the npm
  # registry's signatures and provenance attestations (npm audit signatures). npm has no ignore
  # list: fix a finding by upgrading or with an `overrides` entry in the root package.json.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - run: npm audit signatures
  # Every npm workspace from the root (apps/*, packages/*, infra and demo/): what `npm run check`
  # runs locally (typecheck, lint, test), as separate steps so a failure names its step, then a
  # listing of the Rule 1-9 access suite (rules.test.ts, verbose), the build, the local database
  # (npm run db:reset), the integration tests (npm run test:integration), the server's start-up
  # check (scripts/check-server.sh) from source and from the image, and the image's migrate step.
  # The tests include the guards in scripts/guards/ (no AI packages, no secret-shaped VITE_
  # variables, files the server loads that Node can run). Keep CLAUDE.md (Testing and CI) in step
  # with this job. It waits for secrets and audit, so it gates merging on them too. From C0.8 it
  # also installs Playwright's browsers, checks the web bundle against its budget and scans what it
  # ships (scripts/check-web-dist.ts) straight after the build, and runs the web app's end-to-end
  # suite last (npm run e2e), uploading its report when a step fails (T21).
  check:
    needs: [secrets, audit]
    if: always()
    # Pinned, not ubuntu-latest: the visual baselines are made on this image only, so moving to a
    # newer one is a deliberate PR that re-adopts them (T21, D-07).
    runs-on: ubuntu-24.04
    # A server that hangs instead of failing would otherwise hold the runner for six hours. The e2e
    # suite stops itself at half of this (globalTimeout in apps/web/playwright.config.ts), so a
    # stuck run fails, and the failure() upload runs, before GitHub cancels the job (ES-13).
    timeout-minutes: 30
    steps:
      # A failed, cancelled or skipped dependency would skip this job, and GitHub counts a skipped
      # required check as passed.
      - if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: exit 1
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Playwright's browsers for the e2e step (C0.8, T21): Chromium runs every spec, WebKit and
      # Firefox the @smoke ones (NFR-01, OD-07). They come from Playwright's own CDN, not npm, so npm
      # audit doesn't see them; their version is the lockfile's Playwright. Neither Playwright package
      # has an install script, so npm ci fetched none. Tried three times, since apt or the CDN can blip.
      - run: for i in 1 2 3; do npx playwright install --with-deps --only-shell chromium webkit firefox && exit 0; sleep 15; done; exit 1
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # The Rule 1-9 access suite, case by case, todos included, so CI lists every rule
      # (BUILD-PLAN C0.4, T10). `npm test` above already ran it; this prints the names.
      - run: npx vitest run packages/access/rules.test.ts --reporter=verbose
      - run: npm run build
      # The web bundle against apps/web/bundle-budget.json (initial JS and CSS, the largest lazy
      # chunk and the latin fonts; OD-15), and a scan of what it ships: nothing inline in index.html,
      # no data: URL, public npm CDN, model host or Google Fonts, no test hook, and every avatar fill
      # compiled (T21 item 12).
      - run: node scripts/check-web-dist.ts
      # Node runs the server's .ts source with no build step (T2), so prove that every role
      # starts, answers /health and /ready against the local Compose stack (polled, since the
      # worker is ready once each of its loops has run), logs nothing at error level, and stops
      # cleanly on SIGTERM: first from the source, then from the production image. The api and
      # realtime roles connect as hearth_app and the worker as hearth_worker, which
      # `npm run db:reset` sets up (migrations, seed, local logins).
      - run: docker compose up -d --wait
      - run: npm run db:reset
      # Sign-in, devices and socket revocation against the stack (BUILD-PLAN C0.5's "Done when"),
      # and from C0.6 the outbox's events beside every write (each suite sweeps every committed
      # write for its event), changing flags and their reach to every process, and the worker:
      # the job queue, the scheduler and the outbox consumers, exactly once in effect through
      # crashes, zombies, retries and shutdowns (C0.6's "Done when"), listed case by case. From C0.7
      # the realtime gateway (T19), and from C0.8 sign-in by code for everyone with the PIN steps for
      # PIN roles, the code challenge's scripts, the dormant passkeys (the only suite that switches
      # them on) and the web shell's two GETs, none calling a real SMS provider (T20, T21). Each run
      # builds a throwaway database and its own Valkey key prefix, so it can run again.
      - run: npm run test:integration
      - run: scripts/check-server.sh
      - run: docker build -f apps/server/Dockerfile -t hearth-server .
      - run: IMAGE=hearth-server scripts/check-server.sh
      # The image also runs the pre-deploy migrate step (T3): it must hold every migration the
      # database has applied, or Kysely's migrator refuses to run.
      - run: >-
          docker run --rm --read-only --network host
          -e MIGRATION_DATABASE_URL=postgres://postgres:postgres@127.0.0.1:5432/hearth
          hearth-server node src/db/migrate.ts
      # The web app end to end (C0.8, T21 item 11), last, so a red run still shows every step above.
      # The built app over Vite's preview with a throwaway TLS certificate and the production CSP;
      # the api and realtime roles from source on their own hearth_e2e database, rebuilt by the run
      # (DEPLOY_ENV test, Valkey DB 9, the fake SMS provider); Chromium in full (axe at 320, 390 and
      # 1440 px in both schemes, visual regression against baselines made only on this runner, the
      # NFR-02 phone suite, keyboard, CSP, sign-in and session end) and the WebKit and Firefox smoke.
      - run: npm run e2e
      # The report, traces, failure screenshots and every *-actual.png (from which a person adopts
      # the visual baselines: apps/web/e2e/support/adopt-baselines.ts), and the servers' logs, which
      # hold the fake provider's codes for the seed's fictional numbers. Not playwright/.auth, the
      # storage state; every session a trace or log shows ended with the run's throwaway database.
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
            apps/web/playwright/logs/
          retention-days: 7
          if-no-files-found: ignore
  migrations:
    runs-on: ubuntu-latest
    # A migration or test that hangs would otherwise hold the runner for six hours.
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          # The whole history, so the order check below can compare with the base branch.
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      # The migrator (Kysely, T3) and the types generator are Node; nothing here runs install
      # scripts.
      - run: npm ci --ignore-scripts
      # Every migration a PR adds numbers above the highest on its base branch, and none of the
      # base's migrations changed: production has applied those, and a scratch build can't tell.
      - if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE: origin/${{ github.base_ref }}
        run: scripts/check-migration-order.sh "$BASE"
      # Builds a scratch database from every file in db/migrations/ with the migrator production
      # uses, in one transaction, from a session that can only act as hearth_owner, then checks it
      # against CLAUDE.md's Database rules (org_id, RLS, views, grants, functions, ownership, and
      # that no runtime role, hearth_app, the worker's login or a job role among them, can skip RLS).
      - run: scripts/check-migrations.sh
      # The migrator itself, against throwaway databases: it refuses a migration that commits or
      # leaves another role in place, rolls a failed batch back, fails fast on a role it can't
      # take, and refuses a migration numbered below one already applied.
      - run: node apps/server/scripts/check-migrator.ts
      # The Tembusu seed (local and CI data only) loads into it.
      - run: >-
          psql --no-psqlrc -w -v ON_ERROR_STOP=1 -q -d hearth_check --single-transaction
          -c 'set local role hearth_owner' -f db/seed/tembusu.sql
      # DB tests in db/tests/: who can read and write what, for every role, including the ones
      # that must see nothing.
      - run: scripts/test-db.sh
      # Refusals that must hold when two transactions race (someone leaving while given a role,
      # a device signed out while a session starts; from C0.5, a session, device or passkey for
      # someone leaving, a session lookup during a deactivation, ending someone's sessions or
      # resetting their PIN during a sign-in, a number removed during a sign-in, and an admin
      # acting while being deactivated; from C0.6, the queue's fences, leases, claims, schedulers
      # and consumer rounds against flag changes and each other, and the outbox's horizon), in two
      # connections to a throwaway database.
      - run: node apps/server/scripts/check-concurrency.ts
      # The catalogues in code match the database (C0.6): every write grant of every runtime role,
      # every function one can run and every SECURITY DEFINER and trigger function is covered by
      # an outbox event or a reasoned exemption (apps/server/src/outbox/coverage.ts), and the
      # event catalogue, the flag registry and the worker's job roles equal 0007's and 0008's
      # lists; from C0.7, every consumer the worker runs is bound in outbox_checkpoints_own_row()
      # to exactly its role, and every bound name is one of them (0008).
      - run: node apps/server/scripts/check-catalogues.ts
      # The SQL access filter (sqlReadableBy, @hearth/access/sql) selects exactly what the
      # in-memory rule allows, for every person, both assistants and the system principal in the
      # fixture org, on Postgres 17, and still does after membership changes with no row rewritten;
      # a NULL acl_more is nobody's, and agents (who read by scope; A2) match no row (C0.4, SRCH-04).
      - run: node scripts/check-access-sql.ts
      # The Kysely types (apps/server/src/db/schema.ts) match the schema the migrations build.
      - run: npm run db:types
      - run: git diff --exit-code -- apps/server/src/db/schema.ts
      # Risky migrations also get an upgrade step here, after the DB tests:
      #   UP_TO=NNNN scripts/check-migrations.sh && scripts/check-<name>-upgrade.sh
      # builds the database up to the migration before NNNN, loads production-shaped data, applies
      # NNNN and checks the data survived. 0007 (C0.6) has no step of its own: it changes no
      # existing row and adds no rule to an existing table, and the two 0006 runs below apply it too
      # (with everything after 0006) on top of the seeded data, giving the seed's org its flags, and
      # compare the result with the fresh build. 0008 (C0.7) changes no row either, but it replaces
      # outbox_checkpoints_own_row() (the checkpoint trigger on an existing table) so it binds each
      # consumer to its role, and refuses to apply while a checkpoint already there breaks that
      # binding. The seed holds no checkpoint, and a C0.6 deployment holds the offboarding role's,
      # so 0008 gets its own step (below).
      # 0006 (C0.5) on top of sessions and accounts 0005 allows, in its own scratch database: its
      # two new session rules mustn't fail on older rows, and its schema must match the fresh build
      # above (hearth_check) apart from the rule older rows leave NOT VALID. Once for each rule, so
      # each is seen both validated and left NOT VALID.
      - env:
          CHECK_DB: hearth_upgrade_check
        run: UP_TO=0006 scripts/check-migrations.sh && scripts/check-sign-in-upgrade.sh sessions_revoke_reason
      - env:
          CHECK_DB: hearth_upgrade_check
        run: UP_TO=0006 scripts/check-migrations.sh && scripts/check-sign-in-upgrade.sh sessions_at_most_90_days
      # 0008 (C0.7) on top of the checkpoints 0007 allows: refused while one breaks its binding (a
      # revocation checkpoint naming the offboarding role, an offboarding one naming another role),
      # then applied once they're gone, keeping every other checkpoint as it was; the binding holds
      # afterwards for both job roles, and the schema matches the fresh build.
      - env:
          CHECK_DB: hearth_upgrade_check
        run: UP_TO=0008 scripts/check-migrations.sh && scripts/check-revocation-upgrade.sh

# The local stack for development and CI (C0.2; TECH-SPEC T9). Production uses RDS, ElastiCache
# and S3 instead, so nothing here is deployed. Every port is published on 127.0.0.1 only, and the
# credentials are dummy local values, the same ones .env.example gives the server.
#
#   docker compose up -d --wait    start everything and wait until it is healthy
#   docker compose down -v         stop it and delete its data
name: hearth

services:
  # Postgres 17 with pgvector available (the extension stays off until A2), from the image CI's
  # migrations job uses. user and password postgres on 127.0.0.1:5432 are the defaults
  # scripts/check-migrations.sh and scripts/test-db.sh connect to.
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hearth
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "hearth"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 30s
      start_interval: 500ms

  # Valkey 9.1, the line ElastiCache for Valkey runs. Nothing is persisted: it holds only caches,
  # rate-limit counters and fan-out.
  valkey:
    image: valkey/valkey:9.1.2-alpine@sha256:48332870af354a799964c0012ae1194a0bf2bf894eb508f945810596dc2d8d11
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      # valkey-cli exits 0 even on an error reply, so the check looks for PONG.
      test: ["CMD-SHELL", "valkey-cli ping | grep -q PONG"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 30s
      start_interval: 500ms

  # RustFS, an S3-compatible store (Apache-2.0), in place of MinIO, whose images are no longer
  # published and whose community edition is unmaintained (TECH-SPEC T9).
  s3:
    image: rustfs/rustfs:1.0.1@sha256:1803faef57627e2d9c2e7d89d655d712ddded5389040054987163043fecb6a3c
    environment:
      RUSTFS_ACCESS_KEY: hearth-local
      RUSTFS_SECRET_KEY: hearth-local-secret
      RUSTFS_REGION: ap-southeast-1
      # No update check over the internet at start (only "false" turns it off), no web console
      # (where RustFS's past XSS advisories were), and logs on stdout for `docker compose logs`.
      RUSTFS_CHECK_UPDATE: "false"
      RUSTFS_CONSOLE_ENABLE: "false"
      RUSTFS_OBS_LOG_DIRECTORY: ""
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - s3-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:9000/health/ready"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 30s
      start_interval: 500ms

  # Creates the server's bucket, then stays up doing nothing, healthy once the bucket exists. A
  # container that exits, even cleanly, makes `docker compose up --wait` fail. Uses the RustFS
  # image for its curl, which signs the request (--aws-sigv4).
  s3-bucket:
    image: rustfs/rustfs:1.0.1@sha256:1803faef57627e2d9c2e7d89d655d712ddded5389040054987163043fecb6a3c
    depends_on:
      s3:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY_ID: hearth-local
      S3_SECRET_ACCESS_KEY: hearth-local-secret
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        keys="$$S3_ACCESS_KEY_ID:$$S3_SECRET_ACCESS_KEY"
        code=$$(curl -sS -o /dev/null -w '%{http_code}' --aws-sigv4 aws:amz:ap-southeast-1:s3 \
          --user "$$keys" -X PUT http://s3:9000/hearth-local)
        case "$$code" in
          200|409) echo "bucket hearth-local ready ($$code)" ;;
          *) echo "creating bucket hearth-local failed: HTTP $$code" >&2; exit 1 ;;
        esac
        touch /tmp/bucket-ready
        trap 'exit 0' TERM INT
        while :; do sleep 3600 & wait $$!; done
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/bucket-ready"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 30s
      start_interval: 500ms

volumes:
  postgres-data:
  s3-data:

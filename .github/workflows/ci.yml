name: ci
on:
  pull_request: {}
  push:
    branches: [main]
# The job ids `check` and `migrations` are the required checks in .github/rulesets/protect-main.json.
# Don't rename them, give them a `name:`, add a matrix, or move them to another workflow: a PR then
# waits forever for a check that never reports. Add new work as steps in these jobs where you can.
# A new job that must gate merging is either added to protect-main.json's required checks (and
# the ruleset re-applied) or listed in a required job's `needs:`. Then that required job needs
# `if: always()` and a first step
#   - if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
#     run: exit 1
# because a failing dependency skips it, and GitHub counts a skipped required check as passed.
jobs:
  # Until the npm-workspaces monorepo lands, the only package is demo/, so this runs there and
  # has no lint step. With the workspace it becomes, from the root: npm ci, npm run check
  # (typecheck, lint, test) and the build; update CLAUDE.md (Testing and CI) in the same PR.
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"  # only the local screenshot script uses it
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: demo/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v5
      # Builds a scratch database from every file in db/migrations/, in one transaction, from a
      # session that can only act as hearth_owner, then checks it against CLAUDE.md's Database
      # rules (RLS, views, grants, functions, ownership, hearth_app's attributes).
      - run: scripts/check-migrations.sh
      # DB tests in db/tests/: who can read and write what, for every role, including the ones
      # that must see nothing.
      - run: scripts/test-db.sh
      # Risky migrations also get an upgrade step here, after the DB tests:
      #   UP_TO=NNNN scripts/check-migrations.sh && scripts/check-<name>-upgrade.sh
      # builds the database up to the migration before NNNN, loads production-shaped data, applies
      # NNNN and checks the data survived.

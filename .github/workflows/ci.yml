name: ci
on:
  pull_request: {}
  push:
    branches: [main]
permissions:
  contents: read
# The job ids `check` and `migrations` are the required checks in .github/rulesets/protect-main.json.
# Don't rename them, give them a `name:`, add a matrix, or move them to another workflow: a PR then
# waits forever for a check that never reports. Add new work as steps in these jobs where you can.
# A new job that must gate merging is either added to protect-main.json's required checks (and
# the ruleset re-applied) or listed in a required job's `needs:`. Then that required job needs
# `if: always()` and a first step
#   - if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
#     run: exit 1
# because a failing dependency skips it, and GitHub counts a skipped required check as passed.
jobs:
  # Secret scan of every commit on every branch (gitleaks), including what a two-parent merge commit
  # itself adds (--remerge-diff, which can't show an octopus merge, so those are refused), with
  # secrets redacted from this public log. The repo is public, so a secret that reached any branch is
  # already exposed. When this fails, rotate the secret first. Then:
  # - only on a feature branch: rewrite or delete that branch;
  # - already on main, which can't be rewritten: add the finding's full Fingerprint from main's run
  #   (commit:path:rule:line) to the root .gitleaksignore;
  # - a false positive: add the Fingerprint without its leading commit (path:rule:line), because the
  #   squash merge gives main a new commit and a commit-specific entry would stop matching.
  # The owner reads every .gitleaksignore change before merge (CLAUDE.md, Git). The PR under scan
  # can't silence itself any other way: gitleaks:allow comments are ignored, and GITLEAKS_CONFIG_TOML
  # pins gitleaks' default rules over any .gitleaks.toml in the repo. gitleaks is installed through
  # the Go module proxy, which checks it against Go's checksum database; Renovate updates the
  # version (renovate.json).
  secrets:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_CONFIG_TOML: |
        [extend]
        useDefault = true
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - name: Refuse octopus merges, which --remerge-diff can't show
        run: |
          octopus=$(git rev-list --all --min-parents=3)
          if [ -n "$octopus" ]; then echo "::error::Octopus merges can't be scanned for secrets: $octopus"; exit 1; fi
      - run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - run: >-
          $(go env GOPATH)/bin/gitleaks git --no-banner --redact --verbose --ignore-gitleaks-allow
          --log-opts="--all --full-history --remerge-diff --diff-filter=tuxdb" .
  # Known vulnerabilities in any installed package, high or critical (npm audit), and the npm
  # registry's signatures and provenance attestations (npm audit signatures). npm has no ignore
  # list: fix a finding by upgrading or with an `overrides` entry in the root package.json.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - run: npm audit signatures
  # Every npm workspace from the root (apps/*, packages/*, infra and demo/): what `npm run check`
  # runs locally (typecheck, lint, test), as separate steps so a failure names its step, then the
  # build. The tests include the guards in scripts/guards/ (no AI packages, no secret-shaped VITE_
  # variables). Keep CLAUDE.md (Testing and CI) in step with this job. It waits for secrets and
  # audit, so it gates merging on them too.
  check:
    needs: [secrets, audit]
    if: always()
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"  # only demo's local screenshot script uses it
    steps:
      # A failed, cancelled or skipped dependency would skip this job, and GitHub counts a skipped
      # required check as passed.
      - if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: exit 1
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      # Builds a scratch database from every file in db/migrations/, in one transaction, from a
      # session that can only act as hearth_owner, then checks it against CLAUDE.md's Database
      # rules (RLS, views, grants, functions, ownership, hearth_app's attributes).
      - run: scripts/check-migrations.sh
      # DB tests in db/tests/: who can read and write what, for every role, including the ones
      # that must see nothing.
      - run: scripts/test-db.sh
      # Risky migrations also get an upgrade step here, after the DB tests:
      #   UP_TO=NNNN scripts/check-migrations.sh && scripts/check-<name>-upgrade.sh
      # builds the database up to the migration before NNNN, loads production-shaped data, applies
      # NNNN and checks the data survived.
